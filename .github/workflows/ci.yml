name: SupportFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: supportflow
          POSTGRES_USER: supportflow
          POSTGRES_PASSWORD: supportflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow -d supportflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        env:
          SECRET_KEY: test-secret-key-for-github-actions-only
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: supportflow
          DB_USER: supportflow
          DB_PASSWORD: supportflow
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py check

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-github-actions-only
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: supportflow
          DB_USER: supportflow
          DB_PASSWORD: supportflow
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t supportflow-web .
